name: Release

on:
  push:
    tags:
      # FIDO tags carry a v prefix: v1.4.1, v1.6.1, v2.0.0rc1. The unprefixed
      # form is accepted too, and the version check is what decides whether a
      # tag and the package agree.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Nothing else verified that the package still builds and installs before a
  # tag was pushed, which is the worst moment to find out. The github-release
  # job is gated on refs/tags, so a pull request runs the metadata checks, the
  # build, the artefact checks and the smoke tests, and creates nothing.
  #
  # Enabled only once the tag-driven run had been verified end to end, so a
  # failure here means the pull request, not the workflow. A pull request from
  # a branch in this same repository also produces a push run of Pytest, so
  # two runs for one push is expected.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  metadata:
    name: Package metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      normalised: ${{ steps.version.outputs.normalised }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install check dependencies
        run: python -m pip install --upgrade packaging

      - name: Read version from package
        id: version
        run: |
          # fido/__init__.py imports nothing but os.path, so the version is
          # readable without installing the runtime dependencies
          version="$(python -c 'import fido; print(fido.__version__)')"
          tag=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag=(--tag "$GITHUB_REF_NAME")
          fi
          # Written to a file rather than piped, so the step log shows the
          # values and the default shell's lack of pipefail cannot mask a
          # failing check
          python .github/scripts/check_release.py version --declared "$version" "${tag[@]}" \
            > "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"

      # A version reaching PyPI with nothing describing it cannot be fixed after
      # the fact, because a version number is never reused
      - name: Check the release notes cover this version
        run: python .github/scripts/check_release.py notes --declared "${{ steps.version.outputs.version }}"

  python-packages:
    name: Python sdist and wheel
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install --upgrade build twine packaging

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # The signature data in fido/conf is shipped through package-data rather
      # than being importable code, so a packaging mistake there produces an
      # artefact that installs cleanly and then cannot identify anything
      - name: Check the artefacts
        run: python .github/scripts/check_release.py artifacts --declared "${{ needs.metadata.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  smoke-test:
    name: Installed ${{ matrix.package }} (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: python-packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Spelled out rather than crossed, because the combinations are not
      # interchangeable: the macOS runners are arm64 and carry no Python below
      # 3.11, and building from the sdist exercises the same pure Python result
      # on every platform, so one run of it is enough
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.9'
            package: wheel
          - os: ubuntu-24.04
            python-version: '3.13'
            package: wheel
          - os: macos-15
            python-version: '3.13'
            package: wheel
          - os: windows-2025
            python-version: '3.9'
            package: wheel
          - os: windows-2025
            python-version: '3.13'
            package: wheel
          - os: ubuntu-24.04
            python-version: '3.13'
            package: sdist
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: dist

      # Installed from the built artefact in a clean environment, with no
      # checkout, so nothing can be satisfied from the source tree by accident
      - name: Install the ${{ matrix.package }}
        shell: bash
        run: |
          if [[ "${{ matrix.package }}" == "wheel" ]]; then
            artefact="$(find dist -name '*.whl' -print -quit)"
          else
            artefact="$(find dist -name '*.tar.gz' -print -quit)"
          fi
          echo "Installing $artefact"
          python -m pip install --upgrade pip
          python -m pip install "$artefact"

      - name: Identify a known file
        shell: bash
        run: |
          printf 'GIF89a\x01\x00\x01\x00\x00\x00\x00;' > sample.gif
          fido -v
          fido sample.gif | tee result.csv
          grep -q 'fmt/4' result.csv || {
            echo "expected fido to identify a GIF as fmt/4" >&2
            exit 1
          }

  github-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [metadata, python-packages, smoke-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: assets

      - name: List assets
        run: ls -lh assets

      # Created as a draft so the release title and description are still
      # written by hand before the release goes public, and so publishing the
      # release stays the deliberate step that triggers the PyPI upload
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber assets/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --prerelease="$PRERELEASE" \
              assets/*
          fi
