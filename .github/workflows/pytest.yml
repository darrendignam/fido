name: Pytest

on:
  push:
  # A pull request from a fork never triggers this repository's workflows on
  # push, so without this the tests do not run on contributed changes at all
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" coverage-badge
      # Configuration lives in .flake8, so a bare flake8 run locally is the
      # same check. fido itself is not linted yet: it reports one F824 that has
      # a fix of its own in flight
      - name: Lint with flake8
        run: flake8 tests --count --show-source --statistics
      - name: Test with pytest
        run: pytest --cov=fido --cov-report=xml
      - name: Generate coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        run: coverage-badge -f -o coverage.svg
      - name: Commit coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push
