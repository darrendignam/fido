# Publishing is triggered by publishing the GitHub release, so the draft release
# created by release.yml is the review step for what reaches PyPI.
#
# Requires a PyPI trusted publisher for this repository and workflow. Until that
# exists the job fails at the token exchange without uploading anything. See:
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#
# The "pypi" environment below is created automatically on first run, but an
# auto-created environment carries no protection rules, so on its own it gates
# nothing. Add required reviewers to it in the repository settings if an upload
# to PyPI should wait for a human.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/opf-fido
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install --upgrade build twine packaging

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # A release built from the wrong ref would upload the wrong version, and an
      # upload cannot be replaced: PyPI never reuses a version number
      - name: Check the release tag matches the package version
        run: |
          version="$(python -c 'import fido; print(fido.__version__)')"
          tag=()
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag=(--tag "${{ github.event.release.tag_name }}")
          fi
          python .github/scripts/check_release.py version --declared "$version" "${tag[@]}"
          python .github/scripts/check_release.py artifacts --declared "$version"

      - uses: pypa/gh-action-pypi-publish@release/v1
